name: Scrape competitor pricing

on:
  schedule:
    # 06:00 UTC daily (~4pm AEST)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run scrape

      - name: Commit updated price snapshot
        run: |
          git config user.name "desky-pricing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pricing.db
          git diff --cached --quiet && echo "No price changes" || git commit -m "chore: scrape latest competitor pricing"
          git push
